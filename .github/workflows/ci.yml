name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests drive the engine directly, so they don't need Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
          ffmpeg -hide_banner -encoders | grep -E "prores_ks|libx264"
      - run: npm ci
      - name: Download Chromium
        run: npx playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Test
        run: npm test
      - name: Package the Premiere panel
        run: npm run panel

  app:
    name: Build the Mac app
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test
        # Starts the app, waits for the engine and the window, saves a screenshot and quits.
        run: |
          perl -e 'alarm 180; exec @ARGV' npx electron .
          test -s smoke.png
        env:
          CANVAS_RENDER_SMOKE: ${{ github.workspace }}/smoke.png
      - name: Build the .dmg
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package the Premiere panel
        run: npm run panel
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-render-macos
          path: |
            dist/*.dmg
            release/*.ccx
            smoke.png
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            release/*.ccx
