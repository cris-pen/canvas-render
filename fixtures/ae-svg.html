<!doctype html>
<!-- SVG the way design tools write it: definitions, nested groups with their own
     transforms, paths with several subpaths and arcs, rounded rects, a morphing
     path, a path that grows point by point, and SVG text. Used by the After
     Effects tests. -->
<html><head><meta charset="utf-8"><title>SVG shapes</title>
<style>
  html, body { margin: 0; width: 640px; height: 360px; background: #0f1a20; overflow: hidden; }
  svg { position: absolute; display: block; }
  #art { left: 20px; top: 20px; width: 400px; height: 300px; }
  #badge { left: 440px; top: 60px; width: 180px; height: 180px; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
  .drift { animation: drift 2s ease-in-out infinite alternate; }
  .rise { animation: rise 2s ease-out both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(30px, 10px); } }
  @keyframes rise { from { transform: translate(0, 120px); } to { transform: translate(0, 0); } }
</style></head>
<body>
<svg id="art" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b6f80"/><stop offset="1" stop-color="#123038"/></linearGradient>
    <clipPath id="unused"><rect width="10" height="10"/></clipPath>
  </defs>
  <rect id="panel" x="4" y="4" width="192" height="142" rx="12" fill="#183740"/>
  <g id="cluster" class="drift" transform="translate(20 20)">
    <g id="inner">
      <!-- Two subpaths: an outer square and an inner one cut out (evenodd). -->
      <path id="frame-icon" fill="#f0c36b" fill-rule="evenodd" d="M0 0 H40 V40 H0 Z M10 10 V30 H30 V10 Z"/>
      <!-- A ring drawn with arcs. -->
      <path id="ring" class="spin" fill="none" stroke="#7fd1c7" stroke-width="4" d="M90 20 a20 20 0 1 1 -0.01 0 Z"/>
    </g>
    <circle id="dot" cx="150" cy="40" r="10" fill="#e9875b"/>
  </g>
  <rect id="swatch" x="164" y="100" width="24" height="24" rx="4" fill="url(#sky)"/>
  <path id="morph" fill="none" stroke="#f7f3ea" stroke-width="3" d="M20 110 L60 110 L100 110 L140 110"/>
  <path id="trail" fill="none" stroke="#e9875b" stroke-width="2" d=""/>
</svg>
<svg id="badge" viewBox="0 0 90 90">
  <g id="badge-art" class="rise">
    <circle id="badge-disc" cx="45" cy="45" r="40" fill="#2ec4b6"/>
    <text id="badge-label" x="45" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f1a20">GO</text>
  </g>
</svg>
<script>
  // Driven by the clock the renderer controls, like any page animation.
  const morph = document.getElementById('morph');
  const trail = document.getElementById('trail');
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    const k = Math.min(1, t / 2);
    const ys = [0, 1, 2, 3].map((i) => 110 - 20 * Math.sin(k * Math.PI) * (i % 2 ? 1 : -1));
    morph.setAttribute('d', `M20 ${ys[0]} L60 ${ys[1]} L100 ${ys[2]} L140 ${ys[3]}`);
    // A trail that gains a point every tenth of a second.
    const n = Math.min(20, Math.floor(t * 10) + 1);
    let d = '';
    for (let i = 0; i < n; i += 1) d += `${i ? 'L' : 'M'}${30 + i * 7} ${135 - 6 * Math.sin(i / 2)} `;
    trail.setAttribute('d', n > 1 ? d : '');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>
