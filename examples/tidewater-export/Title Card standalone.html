<!doctype html>
<!-- Example board for Canvas Render. It follows the same exportable-video
     contract as a Claude Design board: a sized stage with a duration, redrawn
     on the data-om-seek-to-time-frame event. Open it in a browser to watch. -->
<html>
<head>
<meta charset="utf-8">
<title>Title Card</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1c22; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  .wrap { width: 1920px; height: 1080px; position: relative; overflow: hidden;
          background: radial-gradient(120% 90% at 30% 20%, #1f4b55 0%, #12303a 45%, #0b1c22 100%);
          font-family: "Iowan Old Style", "Palatino", Georgia, serif; color: #f1ead9; }
  svg.waves { position: absolute; left: 0; top: 610px; width: 1920px; height: 300px; }
  svg.waves path { fill: none; stroke-linecap: round; }
  .title { position: absolute; left: 220px; top: 330px; font-size: 220px; letter-spacing: -2px; line-height: 1; display: flex; }
  .title span { display: inline-block; will-change: transform; }
  .episode { position: absolute; left: 228px; top: 590px; font: 500 44px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; color: #b9d3cf; letter-spacing: 0.5px; }
  .rule { position: absolute; left: 228px; top: 566px; height: 3px; width: 520px; background: #e7b25a; transform-origin: 0 50%; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" data-om-exportable-video-with-duration-secs="6" data-om-sync-seek="true" data-om-fonts-inlined="true">
  <foreignObject width="1920" height="1080">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <svg class="waves" viewBox="0 0 1920 300">
        <path id="w1" stroke="#e7b25a" stroke-width="5" opacity="0.9"/>
        <path id="w2" stroke="#6fb3a8" stroke-width="4" opacity="0.7"/>
        <path id="w3" stroke="#3e7f80" stroke-width="3" opacity="0.6"/>
      </svg>
      <div class="title" id="title"></div>
      <div class="rule" id="rule"></div>
      <div class="episode" id="episode">Episode 4: The Long Haul</div>
    </div>
  </foreignObject>
</svg>
<script>
  window.OM_SCENES = JSON.stringify([
    { name: 'Waves', dur: 1.5, desc: 'Three lines draw across the bottom.' },
    { name: 'Title', dur: 1.5, desc: 'Letters rise one by one.' },
    { name: 'Episode', dur: 1.5, desc: 'Rule and episode name.' },
    { name: 'Hold', dur: 1.5, desc: '' },
  ]);
  const word = 'Tidewater';
  const title = document.getElementById('title');
  const letters = [...word].map((c) => { const s = document.createElement('span'); s.textContent = c; title.append(s); return s; });
  const rule = document.getElementById('rule');
  const episode = document.getElementById('episode');
  const waves = ['w1', 'w2', 'w3'].map((id) => document.getElementById(id));
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const out3 = (t) => 1 - Math.pow(1 - clamp(t), 3);
  const inOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  function wavePath(k, t) {
    const amp = 26 - k * 6; const len = 260 + k * 70; const y0 = 80 + k * 60; const phase = t * (1.1 + k * 0.35) * Math.PI;
    let d = '';
    for (let x = -40; x <= 1960; x += 20) d += `${x === -40 ? 'M' : 'L'}${x} ${(y0 + Math.sin(x / len * Math.PI * 2 + phase) * amp).toFixed(2)} `;
    return d;
  }
  function draw(t) {
    waves.forEach((p, k) => {
      p.setAttribute('d', wavePath(k, t));
      const L = 2300;
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = (L * (1 - inOut((t - k * 0.18) / 1.3))).toFixed(1);
    });
    letters.forEach((s, i) => {
      const p = out3((t - 1.4 - i * 0.07) / 0.6);
      s.style.transform = `translateY(${((1 - p) * 90).toFixed(2)}px)`;
      s.style.opacity = p.toFixed(3);
    });
    rule.style.transform = `scaleX(${inOut((t - 3) / 0.7).toFixed(4)})`;
    const e = out3((t - 3.3) / 0.8);
    episode.style.opacity = e.toFixed(3);
    episode.style.transform = `translateX(${((1 - e) * -30).toFixed(2)}px)`;
  }
  const stage = document.getElementById('stage');
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; }
  // Once something seeks the stage (the renderer, a scrubber), it stops playing on its own.
  let playing = true;
  stage.addEventListener('data-om-seek-to-time-frame', (e) => { playing = !!e.detail.playing; draw(e.detail.time); });
  addEventListener('resize', fit); fit();
  const t0 = performance.now();
  (function tick(now) { if (playing) draw(((now - t0) / 1000) % 6); requestAnimationFrame(tick); })(t0);
</script>
</body>
</html>
