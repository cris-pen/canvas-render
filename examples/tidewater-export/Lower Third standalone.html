<!doctype html>
<!-- Example board for Canvas Render: a lower third on a transparent stage. -->
<html>
<head>
<meta charset="utf-8">
<title>Lower Third</title>
<style>
  html, body { margin: 0; height: 100%; background: #3a3f44; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  .wrap { width: 1920px; height: 1080px; position: relative; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .plate { position: absolute; left: 140px; top: 820px; height: 132px; width: 760px; background: #0f2a30; clip-path: inset(0 100% 0 0); }
  .accent { position: absolute; left: 140px; top: 820px; width: 10px; height: 132px; background: #e7b25a; transform-origin: 50% 100%; }
  .name { position: absolute; left: 186px; top: 842px; color: #f1ead9; font: 600 52px/1 "Iowan Old Style", Palatino, Georgia, serif; white-space: nowrap; }
  .role { position: absolute; left: 188px; top: 906px; color: #9fc7c0; font-size: 28px; letter-spacing: 0.4px; white-space: nowrap; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" data-om-exportable-video-with-duration-secs="5" data-om-sync-seek="true" data-om-fonts-inlined="true">
  <foreignObject width="1920" height="1080">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <div class="plate" id="plate"></div>
      <div class="accent" id="accent"></div>
      <div class="name" id="name">Maren Holloway</div>
      <div class="role" id="role">Harbor pilot, 22 years</div>
    </div>
  </foreignObject>
</svg>
<script>
  window.OM_SCENES = JSON.stringify([
    { name: 'In', dur: 1, desc: 'Accent grows, plate wipes on.' },
    { name: 'Hold', dur: 3, desc: '' },
    { name: 'Out', dur: 1, desc: 'Plate wipes off.' },
  ]);
  const $ = (id) => document.getElementById(id);
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const out3 = (t) => 1 - Math.pow(1 - clamp(t), 3);
  const in3 = (t) => Math.pow(clamp(t), 3);
  function draw(t) {
    const grow = out3(t / 0.35) * (1 - in3((t - 4.55) / 0.35));
    $('accent').style.transform = `scaleY(${grow.toFixed(4)})`;
    const wipeIn = out3((t - 0.2) / 0.6); const wipeOut = in3((t - 4.1) / 0.5);
    const right = (1 - wipeIn) * 100; const left = wipeOut * 100;
    $('plate').style.clipPath = `inset(0 ${right.toFixed(2)}% 0 ${left.toFixed(2)}%)`;
    const n = out3((t - 0.45) / 0.5) * (1 - in3((t - 3.95) / 0.35));
    $('name').style.opacity = n.toFixed(3);
    $('name').style.transform = `translateX(${((1 - n) * -24).toFixed(2)}px)`;
    const r = out3((t - 0.6) / 0.5) * (1 - in3((t - 3.9) / 0.35));
    $('role').style.opacity = r.toFixed(3);
    $('role').style.transform = `translateX(${((1 - r) * -24).toFixed(2)}px)`;
  }
  const stage = $('stage');
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; }
  // Once something seeks the stage (the renderer, a scrubber), it stops playing on its own.
  let playing = true;
  stage.addEventListener('data-om-seek-to-time-frame', (e) => { playing = !!e.detail.playing; draw(e.detail.time); });
  addEventListener('resize', fit); fit();
  const t0 = performance.now();
  (function tick(now) { if (playing) draw(((now - t0) / 1000) % 5); requestAnimationFrame(tick); })(t0);
</script>
</body>
</html>
